name: fig6_tier1_planners
description: "Tier 1: Multi-Planner Benchmark across 3 Kinematic Regimes (Express 1.5m/s, Standard 0.8m/s, Acoustic-Tamed 0.35m/s)"
contestants:
  # =========================================================================
  # 1. DWB (Dynamic Window Approach - Discrete Velocity Space Sampling)
  # =========================================================================
  - name: dwb-express
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 1.50
    linear_acc: 2.50
    linear_decel: -2.50
    max_angular_vel: 1.80
    angular_acc: 3.20

  - name: dwb-standard
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.80
    linear_acc: 1.50
    linear_decel: -1.50
    max_angular_vel: 1.20
    angular_acc: 2.00

  - name: dwb-acoustic-tamed
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.35
    linear_acc: 0.75
    linear_decel: -0.75
    max_angular_vel: 0.80
    angular_acc: 1.00

  # =========================================================================
  # 2. Regulated Pure Pursuit (RPP - Geometric Path Tracking & Adaptive Decel)
  # =========================================================================
  - name: rpp-express
    mobile:
      driver: nav2
      local_planner: regulated_pure_pursuit
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 1.50
    max_angular_vel: 1.80

  - name: rpp-standard
    mobile:
      driver: nav2
      local_planner: regulated_pure_pursuit
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.80
    max_angular_vel: 1.20

  - name: rpp-acoustic-tamed
    mobile:
      driver: nav2
      local_planner: regulated_pure_pursuit
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.35
    max_angular_vel: 0.80

  # =========================================================================
  # 3. Graceful Controller (Nonlinear Lyapunov Control for Smooth Curvature)
  # =========================================================================
  - name: graceful-express
    mobile:
      driver: nav2
      local_planner: graceful
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 1.50
    max_angular_vel: 1.80

  - name: graceful-standard
    mobile:
      driver: nav2
      local_planner: graceful
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.80
    max_angular_vel: 1.20

  - name: graceful-acoustic-tamed
    mobile:
      driver: nav2
      local_planner: graceful
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.35
    max_angular_vel: 0.80

  # =========================================================================
  # 4. MPPI (Model Predictive Path Integral - Stochastic Trajectory Optimization)
  # =========================================================================
  - name: mppi-express
    mobile:
      driver: nav2
      local_planner: mppi
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 1.50
    linear_acc: 2.50
    linear_decel: -2.50
    max_angular_vel: 1.80
    angular_acc: 3.20

  - name: mppi-standard
    mobile:
      driver: nav2
      local_planner: mppi
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.80
    linear_acc: 1.50
    linear_decel: -1.50
    max_angular_vel: 1.20
    angular_acc: 2.00

  - name: mppi-acoustic-tamed
    mobile:
      driver: nav2
      local_planner: mppi
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.35
    linear_acc: 0.75
    linear_decel: -0.75
    max_angular_vel: 0.80
    angular_acc: 1.00

  # =========================================================================
  # 5. HATeb (Human-Aware Timed Elastic Band - Elastic Deformation & Social Safety)
  # =========================================================================
  - name: hateb-express
    mobile:
      driver: nav2
      local_planner: hateb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 1.50
    linear_acc: 1.50
    max_angular_vel: 1.50
    angular_acc: 2.00

  - name: hateb-standard
    mobile:
      driver: nav2
      local_planner: hateb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.80
    linear_acc: 0.80
    max_angular_vel: 1.20
    angular_acc: 1.00

  - name: hateb-acoustic-tamed
    mobile:
      driver: nav2
      local_planner: hateb
      inter_planner: navigate_to_pose_w_replanning_and_recovery
    max_linear_vel: 0.35
    linear_acc: 0.35
    max_angular_vel: 0.80
    angular_acc: 0.50
