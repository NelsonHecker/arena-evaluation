  - name: dwb-inter-replan-distance
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_w_replanning_distance
  - name: dwb-inter-replan-on-invalid
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_w_recovery_and_replanning_only_if_path_becomes_invalid
  - name: dwb-inter-consistent-replan
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: nav_to_pose_with_consistent_replanning_and_if_path_becomes_invalid
  - name: dwb-inter-goal-patience
    mobile:
      driver: nav2
      local_planner: dwb
      inter_planner: navigate_to_pose_w_replanning_goal_patience_and_recovery

