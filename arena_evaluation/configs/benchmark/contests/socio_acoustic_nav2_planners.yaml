name: socio_acoustic_nav2_planners
description: 'ICRA 2027 Socio-Acoustic Nav2 Benchmark: 5 Controllers x 3 Kinematic
  Regimes (Express 1.4m/s, Standard 0.8m/s, Acoustic-Tamed 0.35m/s)'
contestants:
- name: dwb-standard
  mobile:
    driver: nav2
    local_planner: dwb
    inter_planner: navigate_to_pose_w_replanning_and_recovery
  max_linear_vel: 0.8
  linear_acc: 1.5
  linear_decel: -1.5
  max_angular_vel: 1.2
  angular_acc: 2.0
