# Open-loop characterization report: energy & acoustic profiles per maneuver
# working point, derived entirely from the per-sample 1NF series table
# (metrics/series_characterization.parquet, exposed as v_series_characterization).
# Every sample carries its phase label, actual/commanded motion and instantaneous
# power, acoustic level and efficiency; the renderers aggregate per physical
# working point (mean ± std / L_Aeq / max).
manifest_version: "1.0"
name: characterization
title: Open-Loop Characterization Report
description: Comprehensive energy, acoustic, dynamic surge, and actuator fidelity characterization across multi-mode operating working points.
data_source: v_series_characterization
groups:
  - {id: overview, title: Overview & Multi-Phase Summary}
  - {id: tracking_fidelity, title: Actuator Tracking & Velocity Fidelity}
  - {id: power_curves, title: Power vs. Actual Velocity Curves}
  - {id: efficiency_curves, title: Energy Intensity & Cost of Transport}
  - {id: arc_steering, title: Curvilinear Arc Steering Performance}
  - {id: holonomic_curves, title: Holonomic Lateral Cruising}
  - {id: dynamic_surges, title: Dynamic Acceleration & Deceleration Surges}
  - {id: acoustic_curves, title: Acoustic Noise Levels vs. Dynamic State}
  - {id: time_traces, title: Continuous Time Profiles}
units:
  power_total_w: W
  power_mech_w: W
  dba: dBA
  vx_achieved_mps: m/s
  vy_achieved_mps: m/s
  wz_achieved_radps: rad/s
  accel_achieved_mps2: m/s^2
  accel_target_mps2: m/s^2
  efficiency: ""
  vx_target_mps: m/s
  vy_target_mps: m/s
  wz_target_radps: rad/s
  turn_radius_m: m
  energy_intensity_j_m: J/m
  energy_per_rad_j_rad: J/rad
  time_s: s
summary:
  - {metric: speed_achieved_mps, label: Mean Speed, format: "{:.2f}"}
  - {metric: power_total_w, label: Total Power, format: "{:.1f}"}
  - {metric: power_mech_w, label: Mech Power, format: "{:.1f}"}
  - {metric: dba, label: Sound Level, format: "{:.1f}"}
  - {metric: energy_intensity_j_m, label: Energy Intensity, format: "{:.2f}"}
summary_group_by: [phase_kind, speed_target_mps]
plots:
  # ── Overview & Summary ──────────────────────────────────────────────────────
  - id: notes_table
    type: table
    title: Analysis Notes & Methodology
    data_key: "*"
    layout_group: overview
    options:
      notes:
        - {label: Working points, value: "Every sample carries the phase label the sweep published on characterization_phase, resolved against the characterization_schedule table recorded with the episode. Labels the table lacks fall back to cmd_vel classification and lower char_phase_coverage."}
        - {label: Steady state, value: "The first 1.5 s of every linear, lateral and arc dwell (1.0 s of every pivot) is tagged transient and excluded from the cruising curves."}
        - {label: Envelope, value: "Speeds, pivot rates and arc radii come from the robot's caps/mobile.yaml. Sweeps end exactly on the rated limits and arcs are skipped when their required yaw rate exceeds the rated angular limit."}
        - {label: Ramps, value: "accel_target is the commanded rate vx/horizon, signed negative on ramp_down. Apex holds (ramp_apex) and brake approaches are separate kinds and never enter the acceleration plots."}
        - {label: Power, value: "Total electrical power is the power_publisher estimate. Mechanical power is sum |tau * omega| over joint_states. Acoustic level falls back to a joint-state drivetrain model when no acoustics topic was recorded."}
  - id: bar_idle_standby_power
    type: bar
    title: Baseline Standby / Idle Power Draw by Robot
    data_key: power_total_w
    differentiate: robot_model
    layout_group: overview
    filter: {phase_kind: idle}

  # ── Actuator Tracking & Velocity Fidelity ───────────────────────────────────
  - id: scatter_achieved_vs_commanded_linear
    type: scatter
    title: Linear Velocity Fidelity (Achieved vs. Commanded)
    data_key: vx_target_mps
    differentiate: robot_model
    filter: {phase_kind: [linear, ramp_up, ramp_down]}
    layout_group: tracking_fidelity
    options: {y: vx_achieved_mps}
  - id: scatter_achieved_vs_commanded_angular
    type: scatter
    title: Angular Velocity Fidelity (Achieved vs. Commanded)
    data_key: wz_target_radps
    differentiate: robot_model
    filter: {phase_kind: [angular, arc]}
    layout_group: tracking_fidelity
    options: {y: wz_achieved_radps}
  - id: line_accel_achieved_vs_target
    type: line
    title: Dynamic Acceleration Tracking (Achieved vs. Commanded Rate)
    data_key: accel_target_mps2
    group_by: [robot_model]
    filter: {phase_kind: [ramp_up, ramp_down]}
    options: {y: accel_achieved_mps2, aggregate: true, bin_x: 0.2, mode: "lines+markers"}
    layout_group: tracking_fidelity

  # ── Power vs. Actual Velocity Curves ────────────────────────────────────────
  - id: line_power_vs_vx_achieved
    type: line
    title: Total Electrical Power vs. Actual Linear Speed (Cruising)
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: power_total_w, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: power_curves
  - id: line_mech_power_vs_vx_achieved
    type: line
    title: Mechanical Power vs. Actual Linear Speed (Cruising)
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: power_mech_w, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: power_curves
  - id: line_efficiency_vs_vx_achieved
    type: line
    title: Drivetrain Conversion Efficiency vs. Actual Linear Speed
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: efficiency, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: power_curves
  - id: line_power_vs_wz_achieved
    type: line
    title: Total Power vs. Actual Angular Velocity (Pivot Rotation)
    data_key: wz_achieved_radps
    group_by: [robot_model]
    filter: {phase_kind: angular}
    options: {y: power_total_w, aggregate: true, bin_x: 0.1, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: power_curves
  - id: line_mech_power_vs_wz_achieved
    type: line
    title: Mechanical Power vs. Actual Angular Velocity (Pivot Rotation)
    data_key: wz_achieved_radps
    group_by: [robot_model]
    filter: {phase_kind: angular}
    options: {y: power_mech_w, aggregate: true, bin_x: 0.1, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: power_curves

  # ── Energy Intensity & Cost of Transport ────────────────────────────────────
  - id: line_energy_intensity_vs_vx_achieved
    type: line
    title: Energy Intensity (J/m) vs. Actual Linear Speed (Bathtub Cruising Curve)
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: energy_intensity_j_m, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: efficiency_curves
  - id: line_energy_per_rad_vs_wz_achieved
    type: line
    title: Rotational Cost of Transport (J/rad) vs. Actual Angular Speed
    data_key: wz_achieved_radps
    group_by: [robot_model]
    filter: {phase_kind: angular}
    options: {y: energy_per_rad_j_rad, aggregate: true, bin_x: 0.1, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: efficiency_curves

  # ── Curvilinear Arc Steering Performance ────────────────────────────────────
  - id: line_power_vs_turn_radius_arc
    type: line
    title: Total Power vs. Turn Radius (Curvilinear Steering)
    data_key: turn_radius_m
    group_by: [vx_target_mps]
    filter: {phase_kind: arc}
    options: {y: power_total_w, aggregate: true, mode: "lines+markers", error_mode: ci95, smooth: true}
    layout_group: arc_steering
  - id: line_mech_power_vs_turn_radius_arc
    type: line
    title: Mechanical Power vs. Turn Radius (Curvilinear Steering)
    data_key: turn_radius_m
    group_by: [vx_target_mps]
    filter: {phase_kind: arc}
    options: {y: power_mech_w, aggregate: true, mode: "lines+markers", error_mode: ci95, smooth: true}
    layout_group: arc_steering

  # ── Holonomic Lateral Cruising ──────────────────────────────────────────────
  - id: line_power_vs_vy_achieved
    type: line
    title: Total Power vs. Actual Lateral Speed (Holonomic)
    data_key: vy_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: lateral}
    options: {y: power_total_w, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: holonomic_curves
  - id: line_mech_power_vs_vy_achieved
    type: line
    title: Mechanical Power vs. Actual Lateral Speed (Holonomic)
    data_key: vy_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: lateral}
    options: {y: power_mech_w, aggregate: true, bin_x: 0.05, mode: "lines+markers", error_mode: ci95, smooth: true, trim_percentile: 0.05}
    layout_group: holonomic_curves

  # ── Dynamic Acceleration & Braking Surges ───────────────────────────────────
  - id: line_power_vs_accel_achieved
    type: line
    title: Dynamic Surge Power vs. Actual Acceleration (m/s²)
    data_key: accel_achieved_mps2
    group_by: [robot_model]
    filter: {phase_kind: [ramp_up, ramp_down]}
    options: {y: power_total_w, aggregate: true, bin_x: 0.1, mode: "lines+markers", error_mode: ci95, smooth: true}
    layout_group: dynamic_surges
  - id: line_dynamic_braking_surges
    type: line
    title: Power Draw During Emergency Braking Steps
    data_key: time_s
    group_by: [robot_model]
    filter: {phase_kind: brake}
    options: {y: power_total_w, aggregate: true, mode: "lines+markers", error_mode: ci95, smooth: true}
    layout_group: dynamic_surges

  # ── Acoustic Noise Levels vs. Dynamic State ─────────────────────────────────
  - id: line_leq_vs_vx_achieved
    type: line
    title: Equivalent Level L_Aeq vs. Actual Linear Speed (Cruising)
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: dba, aggregate: true, bin_x: 0.05, reduce: leq, mode: "lines+markers"}
    layout_group: acoustic_curves
  - id: line_lafmax_vs_vx_achieved
    type: line
    title: Peak Sound Level L_AFmax vs. Actual Linear Speed (Cruising)
    data_key: vx_achieved_mps
    group_by: [robot_model]
    filter: {phase_kind: linear}
    options: {y: dba, aggregate: true, bin_x: 0.05, reduce: max, mode: "lines+markers"}
    layout_group: acoustic_curves
  - id: line_leq_vs_wz_achieved
    type: line
    title: Equivalent Level L_Aeq vs. Actual Angular Speed (Pivot Rotation)
    data_key: wz_achieved_radps
    group_by: [robot_model]
    filter: {phase_kind: angular}
    options: {y: dba, aggregate: true, bin_x: 0.1, reduce: leq, mode: "lines+markers"}
    layout_group: acoustic_curves
  - id: line_noise_vs_accel_achieved
    type: line
    title: Acoustic Sound Level (dBA) vs. Actual Acceleration (m/s²)
    data_key: accel_achieved_mps2
    group_by: [robot_model]
    filter: {phase_kind: [ramp_up, ramp_down]}
    options: {y: dba, aggregate: true, bin_x: 0.1, mode: "lines+markers", error_mode: ci95, smooth: true}
    layout_group: acoustic_curves

  # ── Continuous Time Profiles ────────────────────────────────────────────────
  - id: line_power_over_time
    type: line
    title: Total Electrical Power Over Time (mean ± 95% CI)
    data_key: time_s
    group_by: [robot_model]
    options: {y: power_total_w, time_relative: true, aggregate: true, bin_x: 0.1, max_points_per_trace: 5000, error_mode: ci95, smooth: true}
    layout_group: time_traces
  - id: line_mech_power_over_time
    type: line
    title: Mechanical Drivetrain Power Over Time (mean ± 95% CI)
    data_key: time_s
    group_by: [robot_model]
    options: {y: power_mech_w, time_relative: true, aggregate: true, bin_x: 0.1, max_points_per_trace: 5000, error_mode: ci95, smooth: true}
    layout_group: time_traces
  - id: line_dba_over_time
    type: line
    title: Acoustic Noise Level (dBA) Over Time (mean ± 95% CI)
    data_key: time_s
    group_by: [robot_model]
    options: {y: dba, time_relative: true, aggregate: true, bin_x: 0.1, max_points_per_trace: 5000, error_mode: ci95, smooth: true}
    layout_group: time_traces
  - id: line_vx_achieved_over_time
    type: line
    title: Actual Linear Velocity Over Time (mean ± 95% CI)
    data_key: time_s
    group_by: [robot_model]
    options: {y: vx_achieved_mps, time_relative: true, aggregate: true, bin_x: 0.1, max_points_per_trace: 5000, error_mode: ci95, smooth: true}
    layout_group: time_traces

