        - {metric: ped_max_startle_factor, label: "Max Startle Factor (dBA/s)", format: "{:.2f}"}
        - {metric: aeps_linear_s, label: "AEPS Personal Space Power (s)", format: "{:.2f}"}
        - {metric: total_sound_energy_joules, label: "Sound Energy (J)", format: "{:.4f}"}

