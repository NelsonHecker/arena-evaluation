# ==============================================================================
# FAILURE MODE & METRIC DIAGNOSTIC MANIFEST: Deep Calculation & Verification
# ==============================================================================
# In-depth diagnostic report decomposing every evaluation metric into its foundational
# signals, calculation methodology, raw spatial trajectories with baseline overlays
# (Theta* Euclidean line-of-sight demonstration, unobstructed robot baseline, human flows),
# and synchronized timeseries to visually inspect and confirm how metrics were derived.
# ==============================================================================

manifest_version: "1.0"
name: failure_modes
title: Failure Modes & Metric Diagnostic Analysis Report
description: In-depth diagnostic report decomposing every metric into its foundational mathematical definitions, source signals, baseline comparisons (Theta* and unobstructed references), trajectory overlays, and synchronized timeseries.
data_source: metrics

groups:
  - {id: executive_failure_triage, title: "1. Executive Failure Triage & Collision Summary"}
  - {id: theta_star_geometric_baseline, title: "2. Synthetic Human Demonstration Baseline (Theta*) & Trajectory Verification"}
  - {id: multi_agent_relative_throughput, title: "3. Multi-Agent Relative Throughput (MAR) & Unobstructed Reference Comparison"}
  - {id: proxemics_and_psii_penetration, title: "4. Proxemics Zone Violations & Intrusion Severity (PSII Depth Verification)"}
  - {id: passing_etiquette_and_directional_forces, title: "5. Social Passing Etiquette, Anisotropic CI & Directional Disturbances"}
  - {id: kinematic_stress_and_jerk_spikes, title: "6. Kinematic Stress, Jerk Spikes & Dynamic Inflexions"}
  - {id: energy_surges_and_dynamic_dissipation, title: "7. Energy Surges, Kinetic Demand & Dynamic Dissipation"}
  - {id: acoustic_startle_and_personal_exposure, title: "8. Environmental Acoustic Footprint & Pedestrian Startle Events"}
  - {id: synchronized_failure_timeseries, title: "9. Synchronized Multi-Domain Timeseries Profiles"}
  - {id: diagnostic_tradeoff_frontiers, title: "10. Diagnostic Multi-Objective Trade-Off Frontiers"}
  - {id: spatial_failure_traces, title: "11. Spatial Trajectories & Hazard Overlays"}

units:
  success: "%"
  spl: ""
  time_to_goal: s
  path_length: m
  path_efficiency: ""
  idling_time: s
  relative_throughput: ""
  mar: ""
  pfi: m
  collision_amount: ""
  collision_static: ""
  collision_dynamic: ""
  tti_min: s
  tti_mean: s
  movement_towards_peds_ratio: ""
  ade: m
  fde: m
  adtw: ""
  mhd: m
  frechet_distance: m
  topological_complexity: ""
  theta_star_length: m
  velocity_mean: m/s
  velocity_max: m/s
  acceleration_mean: m/s2
  acceleration_max: m/s2
  jerk_mean: m/s3
  jerk_max: m/s3
  curvature_mean: 1/m
  curvature_max: 1/m
  roughness_mean: rad/m
  roughness_max: rad/m
  angle_over_length: rad/m
  personal_space_intrusion_integral: "m·s"
  passing_rule_compliance: ""
  total_time_in_personal_space: s
  avg_velocity_in_personal_space: m/s
  time_in_intimate_zone: s
  time_in_personal_zone: s
  time_in_social_zone: s
  time_in_public_zone: s
  psi_intimate_events: ""
  psi_personal_events: ""
  psi_social_events: ""
  max_speed_intimate_zone: m/s
  max_speed_personal_zone: m/s
  max_speed_social_zone: m/s
  ci_mean: ""
  ci_max: ""
  social_force_mean: N
  social_force_max: N
  social_force_ped_mean: N
  social_force_ped_max: N
  ped_path_deflection_m: m
  total_time_looking_at_pedestrians: s
  total_time_looked_at_by_pedestrians: s
  energy_total_wh: Wh
  energy_static_wh: Wh
  energy_mechanical_wh: Wh
  energy_thermal_wh: Wh
  specific_cost_of_transport: ""
  e_cot: ""
  kcsc_wh: Wh
  kinetic_energy_demand_j: J
  friction_dissipation_j: J
  power_peak_w: W
  battery_soc_drop_pct: "%"
  aeps_linear_s: s
  ped_max_exposure_dba: dBA
  ped_leq_exposure_dba: dBA
  ped_max_startle_factor: dBA/s
  total_sound_energy_joules: J
  total_acoustic_work_joules: J

plots:
  # ============================================================================
  # 1. Executive Failure Triage & Collision Summary
  # ============================================================================
  - id: triage_methodology_card
    type: table
    title: "Calculation Methodology: Failure Triage & Success Weighted by Path Length (SPL)"
    data_key: success
    layout_group: executive_failure_triage
    options:
      notes: |
        **Formula: Success weighted by Path Length (SPL)**
        `SPL = S * (L_theta / max(P_actual, L_theta))`
        - `S`: Binary success indicator (`1` if goal reached without timeout/terminal collision, `0` otherwise).
        - `L_theta`: Shortest geodesic Euclidean line-of-sight distance on the dilated static map computed via geometric Theta*.
        - `P_actual`: Total path length traversed by the robot odometry / ground-truth pose trajectory.
        
        **Formula: Critical Reaction Buffer (Time to Collision / TTI)**
        `TTI_min = min_t ( ||p_robot(t) - p_ped(t)|| / ||v_robot(t) - v_ped(t)|| )` for converging velocity vectors.
        `Movement Towards Peds Ratio = (Duration with v_rel . d_rel < 0) / T_total`.

  - id: table_executive_failure_triage
    type: table
    title: Executive Run Verification & Anomaly Matrix
    data_key: success
    layout_group: executive_failure_triage
    options:
      group_by: [local_planner]
      columns:
        - {metric: success, label: "Success Rate (%)", format: "{:.1f}%"}
        - {metric: spl, label: "SPL Score", format: "{:.3f}"}
        - {metric: collision_amount, label: "Total Collisions", format: "{:.2f}"}
        - {metric: collision_static, label: "Static Collisions", format: "{:.2f}"}
        - {metric: collision_dynamic, label: "Dynamic Collisions", format: "{:.2f}"}
        - {metric: tti_min, label: "Min TTI (s)", format: "{:.2f}"}
        - {metric: time_to_goal, label: "Mean Time to Goal (s)", format: "{:.2f}"}
        - {metric: personal_space_intrusion_integral, label: "PSII (m·s)", format: "{:.3f}"}
        - {metric: specific_cost_of_transport, label: "S-CoT", format: "{:.3f}"}
        - {metric: e_cot, label: "Penalized E-CoT", format: "{:.3f}"}

  - id: radar_failure_profile
    type: radar
    title: Multi-Axis Performance & Failure Risk Radar
    data_key: success
    layout_group: executive_failure_triage
    options:
      metrics: [success, spl, collision_amount, tti_min, ci_max, jerk_mean, personal_space_intrusion_integral, e_cot]

  - id: bar_collision_breakdown
    type: bar
    title: Static vs. Dynamic Obstacle Collision Breakdown
    data_key: collision_amount
    differentiate: local_planner
    layout_group: executive_failure_triage
    options:
      stacked: true
      metrics: [collision_static, collision_dynamic]

  - id: box_tti_min_local
    type: box
    title: Minimum Time to Collision (TTI min) - Critical Reaction Margin
    data_key: tti_min
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_failure_triage

  - id: violin_tti_mean_local
    type: violin
    title: Mean Time to Collision (TTI mean in seconds)
    data_key: tti_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_failure_triage

  - id: box_movement_towards_peds_local
    type: box
    title: Movement Towards Pedestrians Ratio (Collision Heading Risk)
    data_key: movement_towards_peds_ratio
    differentiate: local_planner
    auto_differentiate: false
    layout_group: executive_failure_triage

  # ============================================================================
  # 2. Synthetic Human Demonstration Baseline (Theta*) & Trajectory Verification
  # ============================================================================
  - id: theta_star_methodology_card
    type: table
    title: "Calculation Methodology: Synthetic Human Demonstration Reference (Theta*)"
    data_key: path_efficiency
    layout_group: theta_star_geometric_baseline
    options:
      notes: |
        **Baseline: Geometric Theta* (Any-Angle Line-of-Sight)**
        - **C++ Solver**: `processing/path/solver.cpp` executes Bresenham line-of-sight raycasts on the occupancy grid dilated by robot radius `R_robot`.
        - **Geodesic Path Efficiency**: `eta_p = L_theta / L_actual` (ratio of optimal line-of-sight distance to actual distance traveled).
        - **Average Displacement Error (ADE)**: `ADE = (1/N) * sum_i min_j ||p_actual(t_i) - p_theta(s_j)||`
        - **Final Displacement Error (FDE)**: `FDE = ||p_actual(t_end) - goal||`
        - **Discrete Fréchet Distance**: Dynamic programming bottleneck distance aligning curves under decimation `max(d(p_i, q_j))`.
        - **Modified Hausdorff Distance (MHD)**: `MHD = max( (1/N) sum min ||p_i - q_j||, (1/M) sum min ||q_j - p_i|| )`.
        - **Topological Winding Complexity (W)**: Net signed winding loops `W = sum_k |Delta theta_k| / (2*pi)` around obstacles and pedestrians.

  - id: table_theta_star_verification
    type: table
    title: Foundational Geometric Baseline Inspection Table
    data_key: path_efficiency
    layout_group: theta_star_geometric_baseline
    options:
      group_by: [local_planner]
      columns:
        - {metric: theta_star_length, label: "Optimal Theta* Length (m)", format: "{:.2f}"}
        - {metric: path_length, label: "Actual Path Length (m)", format: "{:.2f}"}
        - {metric: path_efficiency, label: "Geodesic Efficiency (eta_p)", format: "{:.3f}"}
        - {metric: ade, label: "ADE (m)", format: "{:.3f}"}
        - {metric: fde, label: "FDE (m)", format: "{:.3f}"}
        - {metric: frechet_distance, label: "Fréchet Distance (m)", format: "{:.3f}"}
        - {metric: mhd, label: "MHD Distance (m)", format: "{:.3f}"}
        - {metric: adtw, label: "ADTW Cost", format: "{:.3f}"}
        - {metric: topological_complexity, label: "Winding Loops (W)", format: "{:.2f}"}

  - id: traj_theta_star_overlay
    type: trajectory
    title: "Visual Confirmation: Robot Trajectory vs. Optimal Theta* Baseline Overlay"
    data_key: path
    differentiate: local_planner
    layout_group: theta_star_geometric_baseline
    options:
      show_map: true
      overlay_markers: true
      overlay_theta_star: true

  - id: violin_efficiency_local
    type: violin
    title: Geodesic Path Efficiency (eta_p = L_theta / L_actual) vs. Theta* Baseline
    data_key: path_efficiency
    differentiate: local_planner
    auto_differentiate: false
    layout_group: theta_star_geometric_baseline

  - id: box_ade_local
    type: box
    title: Average Displacement Error (ADE vs. Theta* Demonstration in metres)
    data_key: ade
    differentiate: local_planner
    auto_differentiate: false
    layout_group: theta_star_geometric_baseline

  - id: box_frechet_local
    type: box
    title: Discrete Fréchet Distance (Curve Alignment vs. Theta* Baseline)
    data_key: frechet_distance
    differentiate: local_planner
    auto_differentiate: false
    layout_group: theta_star_geometric_baseline

  - id: violin_mhd_local
    type: violin
    title: Modified Hausdorff Distance (MHD vs. Theta* Baseline in metres)
    data_key: mhd
    differentiate: local_planner
    auto_differentiate: false
    layout_group: theta_star_geometric_baseline

  - id: box_topological_complexity_local
    type: box
    title: Topological Complexity (Net Signed Winding Loops W around Obstacles)
    data_key: topological_complexity
    differentiate: local_planner
    auto_differentiate: false
    layout_group: theta_star_geometric_baseline

  # ============================================================================
  # 3. Multi-Agent Relative Throughput (MAR) & Reference Baseline Comparisons
  # ============================================================================
  - id: mar_methodology_card
    type: table
    title: "Calculation Methodology: Multi-Agent Relative Throughput (MAR) & Unobstructed Baseline"
    data_key: relative_throughput
    layout_group: multi_agent_relative_throughput
    options:
      notes: |
        **Baseline: Unobstructed Robot Reference (`unobstructed_robot`)**
        The identical robot navigates the identical map from start to goal with all pedestrians removed:
        - **Relative Throughput**: `Relative Throughput = Delta T_unobstructed / Delta T_dynamic` (Efficiency under congestion).
        - **Kinematic Cost of Social Compliance (KCSC)**: `KCSC = E_dynamic - E_unobstructed` (Surplus Wh consumed due to pedestrian avoidance maneuvers).
        - **Pedestrian Flow Interference (PFI)**: Warped displacement error `PFI = DTW(P_ped_actual, P_ped_unhindered)` vs unhindered pedestrians.
        - **Multi-Agent Relative Throughput (MAR)**: `MAR = PFI / max(L_actual - L_unobstructed, 0.01)` (Social detour efficiency ratio).

  - id: table_mar_verification
    type: table
    title: Multi-Agent Reference Baseline Inspection Table
    data_key: relative_throughput
    layout_group: multi_agent_relative_throughput
    options:
      group_by: [local_planner]
      columns:
        - {metric: relative_throughput, label: "Relative Throughput", format: "{:.3f}"}
        - {metric: time_to_goal, label: "Dynamic Travel Time (s)", format: "{:.2f}"}
        - {metric: idling_time, label: "Robot Freezing Time (s)", format: "{:.2f}"}
        - {metric: kcsc_wh, label: "KCSC Surplus Energy (Wh)", format: "{:.3f}"}
        - {metric: pfi, label: "PFI Ped Distortion (m)", format: "{:.3f}"}
        - {metric: mar, label: "MAR Ratio", format: "{:.3f}"}

  - id: traj_mar_reference_overlay
    type: trajectory
    title: "Visual Confirmation: Dynamic Avoidance Path vs. Unobstructed Robot Baseline"
    data_key: path
    differentiate: local_planner
    layout_group: multi_agent_relative_throughput
    options:
      show_map: true
      overlay_markers: true
      overlay_reference: true
      overlay_pedestrians: true

  - id: box_relative_throughput_local
    type: box
    title: Multi-Agent Relative Throughput (T_unobstructed / T_dynamic) by Local Planner
    data_key: relative_throughput
    differentiate: local_planner
    auto_differentiate: false
    layout_group: multi_agent_relative_throughput

  - id: box_kcsc_local
    type: box
    title: Kinematic Cost of Social Compliance (KCSC = E_dynamic - E_unobstructed in Wh)
    data_key: kcsc_wh
    differentiate: local_planner
    auto_differentiate: false
    layout_group: multi_agent_relative_throughput

  - id: box_idling_local
    type: box
    title: Robot Freezing & Idling Time (s) Under Congestion
    data_key: idling_time
    differentiate: local_planner
    auto_differentiate: false
    layout_group: multi_agent_relative_throughput

  # ============================================================================
  # 4. Proxemics Zone Violations & Intrusion Severity (PSII Depth Verification)
  # ============================================================================
  - id: proxemics_methodology_card
    type: table
    title: "Calculation Methodology: Continuous Penetration Depth Integral (PSII)"
    data_key: personal_space_intrusion_integral
    layout_group: proxemics_and_psii_penetration
    options:
      notes: |
        **Formula: Continuous Penetration Depth Integral (PSII)**
        `PSII = sum_i integral_{t in intrusion} (R_personal - d_eff(t)) dt` (in `m·s`).
        - `d_eff(t) = ||p_robot(t) - p_ped(t)|| - (r_robot + r_ped)` is the edge-to-edge physical clearance.
        - **Intimate Zone**: `d_eff < 0.45m` (High-severity intrusion).
        - **Personal Zone**: `0.45m <= d_eff < 1.2m` (Comfort space boundary).
        - **Discrete Invasion Events**: Grouping consecutive intrusion samples with gaps `< 2.0s`.

  - id: table_proxemics_verification
    type: table
    title: Proxemics & Intrusions Verification Table
    data_key: personal_space_intrusion_integral
    layout_group: proxemics_and_psii_penetration
    options:
      group_by: [local_planner]
      columns:
        - {metric: personal_space_intrusion_integral, label: "PSII (m·s)", format: "{:.3f}"}
        - {metric: time_in_intimate_zone, label: "Intimate Zone Time (<0.45m) (s)", format: "{:.2f}"}
        - {metric: total_time_in_personal_space, label: "Personal Zone Time (<1.2m) (s)", format: "{:.2f}"}
        - {metric: psi_intimate_events, label: "Intimate Invasions Count", format: "{:.2f}"}
        - {metric: psi_personal_events, label: "Personal Invasions Count", format: "{:.2f}"}
        - {metric: max_speed_intimate_zone, label: "Peak Speed in Intimate Zone (m/s)", format: "{:.2f}"}
        - {metric: max_speed_personal_zone, label: "Peak Speed in Personal Zone (m/s)", format: "{:.2f}"}

  - id: traj_proxemics_ped_flow
    type: trajectory
    title: "Visual Confirmation: Robot Trajectory with Pedestrian Interaction Flows"
    data_key: path
    differentiate: local_planner
    layout_group: proxemics_and_psii_penetration
    options:
      show_map: true
      overlay_markers: true
      overlay_pedestrians: true

  - id: violin_psii_local
    type: violin
    title: Personal Space Intrusion Integral (PSII = integral (R_p - d_eff) dt in m·s)
    data_key: personal_space_intrusion_integral
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_psii_penetration

  - id: violin_intimate_zone_local
    type: violin
    title: Time in Intimate Zone (< 0.45m Critical Violation Zone)
    data_key: time_in_intimate_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_psii_penetration

  - id: box_speed_intimate_zone_local
    type: box
    title: Peak Velocity While Violating Intimate Space (m/s)
    data_key: max_speed_intimate_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: proxemics_and_psii_penetration

  # ============================================================================
  # 5. Social Passing Etiquette, Anisotropic CI & Directional Disturbances
  # ============================================================================
  - id: etiquette_methodology_card
    type: table
    title: "Calculation Methodology: Passing Rule Etiquette & Directional Anisotropic CI"
    data_key: passing_rule_compliance
    layout_group: passing_etiquette_and_directional_forces
    options:
      notes: |
        **Formula: Directional Collision Index (CI)**
        `CI(t) = exp( - (d_front^2 / (2 * sigma_front^2) + d_side^2 / (2 * sigma_side^2)) )`
        - Rotated into pedestrian heading frame: `sigma_front = 1.0m` (along walking vector), `sigma_side = 0.5m` (lateral).
        
        **Formula: Right-Hand Passing Rule Compliance**
        For oncoming head-on corridor encounters (`v_robot . v_ped < -0.5`):
        `Lateral Offset = cross(v_ped_dir, p_robot - p_ped) >= 0` (Right-hand passing compliance ratio).

  - id: table_etiquette_verification
    type: table
    title: Social Etiquette & Force Verification Table
    data_key: passing_rule_compliance
    layout_group: passing_etiquette_and_directional_forces
    options:
      group_by: [local_planner]
      columns:
        - {metric: passing_rule_compliance, label: "Passing Rule Compliance", format: "{:.2f}"}
        - {metric: ci_mean, label: "Mean Directional CI", format: "{:.3f}"}
        - {metric: ci_max, label: "Peak Directional CI", format: "{:.3f}"}
        - {metric: social_force_ped_mean, label: "Mean Repulsive Force on Peds (N)", format: "{:.2f}"}
        - {metric: social_force_ped_max, label: "Peak Repulsive Force on Peds (N)", format: "{:.2f}"}
        - {metric: ped_path_deflection_m, label: "Induced Pedestrian Deflection (m)", format: "{:.3f}"}

  - id: bar_passing_compliance_local
    type: bar
    title: Passing Rule Compliance Ratio (Right-Hand Corridor Passing Rule)
    data_key: passing_rule_compliance
    differentiate: local_planner
    auto_differentiate: false
    layout_group: passing_etiquette_and_directional_forces

  - id: violin_ci_max_local
    type: violin
    title: Peak Anisotropic Collision Index (CI max)
    data_key: ci_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: passing_etiquette_and_directional_forces

  - id: box_social_force_ped_max_local
    type: box
    title: Peak Repulsive Social Force Exerted on Pedestrians (N)
    data_key: social_force_ped_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: passing_etiquette_and_directional_forces

  - id: violin_ped_deflection_local
    type: violin
    title: Induced Pedestrian Path Deflection (m deviation vs unhindered peds)
    data_key: ped_path_deflection_m
    differentiate: local_planner
    auto_differentiate: false
    layout_group: passing_etiquette_and_directional_forces

  # ============================================================================
  # 6. Kinematic Stress, Jerk Spikes & Dynamic Inflexions
  # ============================================================================
  - id: kinematics_methodology_card
    type: table
    title: "Calculation Methodology: Kinematic Motion & Actuator Jerk Inflexions"
    data_key: velocity_mean
    layout_group: kinematic_stress_and_jerk_spikes
    options:
      notes: |
        **Formulas: Kinematic Motion & Smoothness**
        - **Linear Acceleration**: `a(t) = d|v|/dt` (Rate of change of ground truth linear speed).
        - **Jerk Spike**: `j(t) = d^2|v|/dt^2` (Actuator shock and motion chattering severity).
        - **Path Menger Curvature**: `kappa(t) = 4 * Area(p0, p1, p2) / (d01 * d12 * d20)`.
        - **Path Angular Roughness**: `Roughness = 2 * Area(p0, p1, p2) / d20^2`.

  - id: table_kinematics_verification
    type: table
    title: Kinematic Motion & Smoothness Verification Table
    data_key: velocity_mean
    layout_group: kinematic_stress_and_jerk_spikes
    options:
      group_by: [local_planner]
      columns:
        - {metric: velocity_mean, label: "Mean Velocity (m/s)", format: "{:.2f}"}
        - {metric: velocity_max, label: "Peak Velocity (m/s)", format: "{:.2f}"}
        - {metric: acceleration_mean, label: "Mean Acceleration (m/s²)", format: "{:.2f}"}
        - {metric: acceleration_max, label: "Peak Acceleration (m/s²)", format: "{:.2f}"}
        - {metric: jerk_mean, label: "Mean Jerk (m/s³)", format: "{:.2f}"}
        - {metric: jerk_max, label: "Peak Jerk Spike (m/s³)", format: "{:.2f}"}
        - {metric: curvature_mean, label: "Mean Curvature (1/m)", format: "{:.3f}"}
        - {metric: roughness_mean, label: "Mean Roughness (rad/m)", format: "{:.3f}"}
        - {metric: angle_over_length, label: "Angle / Length (rad/m)", format: "{:.3f}"}

  - id: timeseries_motion_velocity_tracking
    type: timeseries
    title: "Visual Confirmation: Linear Velocity Profile v(t) Timeseries"
    data_key: timeseries_velocity_linear
    differentiate: local_planner
    layout_group: kinematic_stress_and_jerk_spikes

  - id: box_jerk_max_local
    type: box
    title: Peak Jerk Spikes (jerk max in m/s3) - Actuator Chattering Severity
    data_key: jerk_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_stress_and_jerk_spikes

  - id: violin_jerk_mean_local
    type: violin
    title: Mean Jerk (jerk mean in m/s3)
    data_key: jerk_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_stress_and_jerk_spikes

  - id: box_acceleration_max_local
    type: box
    title: Maximum Acceleration (m/s2)
    data_key: acceleration_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_stress_and_jerk_spikes

  - id: box_roughness_max_local
    type: box
    title: Maximum Path Angular Roughness (rad/m)
    data_key: roughness_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_stress_and_jerk_spikes

  # ============================================================================
  # 7. Energy Surges, Kinetic Demand & Dynamic Dissipation
  # ============================================================================
  - id: energy_methodology_card
    type: table
    title: "Calculation Methodology: Energy Demand, Friction & Holistic Cost of Transport"
    data_key: energy_total_wh
    layout_group: energy_surges_and_dynamic_dissipation
    options:
      notes: |
        **Formulas: Subsystem Electrical Energy Breakdown**
        `E_total = integral (P_static + P_mech + P_therm) dt` (in `Wh`).
        - **Kinetic Energy Demand**: `E_kin = sum |Delta( 1/2 m v^2 + 1/2 I omega^2 )|` (in `Joules`).
        - **Rolling Friction Dissipation**: `W_fric = integral (mu_r * m * g * |v(t)|) dt` (where `mu_r` is loaded from `telemetry/power.yaml`).
        - **Specific Cost of Transport (S-CoT)**: `S-CoT = E_total(J) / (m * g * P_actual)`.
        - **Penalized Holistic E-CoT**: `E-CoT = S-CoT * ( 1.0 + 2.0 * N_coll + 0.5 * PSII / T )`.

  - id: table_energy_verification
