  # ============================================================================
  # 8. Environmental Acoustic Footprint & Pedestrian Startle Events
  # ============================================================================
  - id: acoustics_methodology_card
    type: table
    title: "Calculation Methodology: Acoustic Noise Exposure & Startle Factor"
    data_key: ped_max_exposure_dba
    layout_group: acoustic_startle_and_personal_exposure
    options:
      notes: |
        **Formulas: Acoustic Sound Propagation & Human Exposure**
        - **Acoustic Exposure in Personal Space (AEPS)**: `AEPS = integral_{d_eff < 1.2m} 10^(L_p(t)/10) dt` (Linear sound power integral received by humans inside personal space).
        - **Pedestrian Startle Factor**: `Startle = max( dL_p / dt )` (in `dBA/s`, measuring sudden acoustic transients from rapid motor acceleration).
        - **Equivalent Continuous Sound Level (Leq)**: `L_eq = 10 * log10( (1/T) integral 10^(L_p(t)/10) dt )`.

  - id: table_acoustics_verification
