# Safety focus: success rate, SPL, collision breakdown, temporal reaction margins, and interaction hazards.
manifest_version: "1.0"
name: safety
title: Safety & Collision Analysis Report
description: Comprehensive safety report evaluating collision rates, SPL, temporal reaction margins, interaction hazard indices, and kinematic limits.
data_source: metrics
groups:
  - {id: overview, title: Safety Performance Overview}
  - {id: collision_analysis, title: Collision & Goal Completion Dynamics}
  - {id: temporal_margins, title: Temporal Reaction Margins & TTI}
  - {id: interaction_hazards, title: Interaction Hazards & Personal Space Invasions}
  - {id: kinematic_limits, title: Kinematic & Dynamic Stress Limits}
  - {id: tradeoffs, title: Safety Trade-Off Frontiers}
  - {id: details, title: Spatial Trajectories & Hazard Traces}
units:
  success: "%"
  spl: ""
  collision_amount: ""
  collision_static: ""
  collision_dynamic: ""
  tti_min: s
  tti_mean: s
  movement_towards_peds_ratio: ""
  ci_max: ""
  ci_mean: ""
  max_speed_intimate_zone: m/s
  max_speed_personal_zone: m/s
  personal_space_intrusion_integral: "m·s"
  time_in_intimate_zone: s
  psi_intimate_events: ""
  time_to_goal: s
  path_length: m
  velocity_mean: m/s
  velocity_max: m/s
  acceleration_mean: m/s2
  acceleration_max: m/s2
  jerk_mean: m/s3
  jerk_max: m/s3
  roughness_mean: rad/m
plots:
  # ── Overview ────────────────────────────────────────────────────────────────
  - id: safety_summary_table
    type: table
    title: Safety Executive Summary
    data_key: "*"
    layout_group: overview
    options:
      group_by: [local_planner]
      columns:
        - {metric: success, label: Success, format: "{:.0%}"}
        - {metric: spl, label: SPL, format: "{:.2f}"}
        - {metric: collision_amount, label: Total Collisions, format: "{:.1f}"}
        - {metric: collision_static, label: Static Collisions, format: "{:.1f}"}
        - {metric: collision_dynamic, label: Dynamic Collisions, format: "{:.1f}"}
        - {metric: tti_min, label: Min TTI, format: "{:.2f}"}
        - {metric: ci_max, label: Max CI, format: "{:.2f}"}
      notes: notes.yaml
  - id: radar_safety
    type: radar
    title: Multi-Axis Safety & Hazard Profile
    data_key: "*"
    differentiate: local_planner
    auto_differentiate: false
    layout_group: overview
    options:
      metrics: [success, spl, collision_amount, tti_min, ci_max, jerk_mean]

  # ── Collision Analysis ──────────────────────────────────────────────────────
  - id: bar_success_local
    type: bar
    title: Success Rate by Local Planner
    data_key: success
    differentiate: local_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: bar_success_inter
    type: bar
    title: Success Rate by Inter-Planner
    data_key: success
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: bar_spl_local
    type: bar
    title: Success weighted by Path Length (SPL) by Local Planner
    data_key: spl
    differentiate: local_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: bar_spl_inter
    type: bar
    title: Success weighted by Path Length (SPL) by Inter-Planner
    data_key: spl
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: box_collisions_local
    type: box
    title: Total Collisions by Local Planner
    data_key: collision_amount
    differentiate: local_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: box_collisions_inter
    type: box
    title: Total Collisions by Inter-Planner
    data_key: collision_amount
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: collision_analysis
  - id: bar_collision_breakdown
    type: bar
    title: Static vs. Dynamic Obstacle Collision Breakdown
    data_key: collision_amount
    differentiate: local_planner
    layout_group: collision_analysis
    options:
      stacked: true
      metrics: [collision_static, collision_dynamic]
  - id: heatmap_success_pivot
    type: heatmap
    title: Success Rate Pivot Grid (Local vs Inter Planner)
    data_key: success
    layout_group: collision_analysis
    options: {x: inter_planner, y: local_planner}
  - id: heatmap_spl_pivot
    type: heatmap
    title: SPL Pivot Grid (Local vs Inter Planner)
    data_key: spl
    layout_group: collision_analysis
    options: {x: inter_planner, y: local_planner}

  # ── Temporal Reaction Margins & TTI ─────────────────────────────────────────
  - id: box_tti_min_local
    type: box
    title: Minimum Time to Collision (TTI min) by Local Planner
    data_key: tti_min
    differentiate: local_planner
    auto_differentiate: false
    layout_group: temporal_margins
  - id: box_tti_min_inter
    type: box
    title: Minimum Time to Collision (TTI min) by Inter-Planner
    data_key: tti_min
    differentiate: inter_planner
    auto_differentiate: false
    layout_group: temporal_margins
  - id: violin_tti_mean_local
    type: violin
    title: Mean Time to Collision (TTI mean) by Local Planner
    data_key: tti_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: temporal_margins
  - id: box_movement_towards_peds_local
    type: box
    title: Movement Towards Pedestrians Ratio by Local Planner
    data_key: movement_towards_peds_ratio
    differentiate: local_planner
    auto_differentiate: false
    layout_group: temporal_margins

  # ── Interaction Hazards ─────────────────────────────────────────────────────
  - id: box_ci_max_local
    type: box
    title: Directional Collision Index (CI Max) by Local Planner
    data_key: ci_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: interaction_hazards
  - id: violin_ci_mean_local
    type: violin
    title: Directional Collision Index (CI Mean) by Local Planner
    data_key: ci_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: interaction_hazards
  - id: box_max_speed_intimate_local
    type: box
    title: Maximum Speed in Intimate Zone by Local Planner
    data_key: max_speed_intimate_zone
    differentiate: local_planner
    auto_differentiate: false
    layout_group: interaction_hazards
  - id: violin_psii_local
    type: violin
    title: Personal Space Intrusion Integral (PSII Depth) by Local Planner
    data_key: personal_space_intrusion_integral
    differentiate: local_planner
    auto_differentiate: false
    layout_group: interaction_hazards

  # ── Kinematic Limits ────────────────────────────────────────────────────────
  - id: box_jerk_mean_local
    type: box
    title: Mean Jerk by Local Planner
    data_key: jerk_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_limits
  - id: box_jerk_max_local
    type: box
    title: Peak Jerk by Local Planner
    data_key: jerk_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_limits
  - id: box_acceleration_max_local
    type: box
    title: Maximum Acceleration by Local Planner
    data_key: acceleration_max
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_limits
  - id: box_roughness_mean_local
    type: box
    title: Path Roughness by Local Planner
    data_key: roughness_mean
    differentiate: local_planner
    auto_differentiate: false
    layout_group: kinematic_limits

  # ── Safety Trade-Off Frontiers ──────────────────────────────────────────────
  - id: scatter_velocity_vs_collisions
    type: scatter
    title: Speed vs. Collision Risk (Mean Velocity vs. Collision Amount)
    data_key: velocity_mean
    differentiate: local_planner
    layout_group: tradeoffs
    options: {y: collision_amount}
  - id: scatter_path_length_vs_tti
    type: scatter
    title: Detour vs. Safety Margin (Path Length vs. Min TTI)
    data_key: path_length
    differentiate: local_planner
    layout_group: tradeoffs
    options: {y: tti_min}
  - id: scatter_spl_vs_collisions
    type: scatter
    title: Navigation Quality vs. Collisions (SPL vs. Collision Amount)
    data_key: collision_amount
    differentiate: local_planner
    layout_group: tradeoffs
    options: {y: spl}
  - id: scatter_jerk_vs_ci
    type: scatter
    title: Dynamic Reactivity vs. Pedestrian Hazard (Max Jerk vs. CI Max)
    data_key: jerk_max
    differentiate: local_planner
    layout_group: tradeoffs
    options: {y: ci_max}

  # ── Spatial Traces ──────────────────────────────────────────────────────────
  - id: trajectory_plot
    type: trajectory
    title: Robot Trajectories with Obstacle Overlays
    data_key: path
    differentiate: local_planner
    auto_differentiate: false
    group_by: [stage]
    layout_group: details
    filter: {is_reference: false}
  - id: pedestrian_trajectory_plot
    type: trajectory
    title: Pedestrian Trajectories & Encounter Corridors
    data_key: pedestrian_path
    differentiate: local_planner
    auto_differentiate: false
    group_by: [stage]
    layout_group: details
    options: {overlay_markers: false}

