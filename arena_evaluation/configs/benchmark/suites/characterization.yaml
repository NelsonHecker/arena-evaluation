# Open-loop characterization: the robot drives its own multi-mode maneuver sweep in an
# empty world (tm_robots: characterization drives exact cmd_vel profiles and
# tags phases: linear, lateral, arc, ramps, brake, angular, idle).
# Episodes = repetitions -> cross-episode confidence bands.
references: false
stages:
  - name: characterization
    map: map_empty
    robot: jackal
    episodes: 1
    tm_robots: characterization
    tm_obstacles: random
    config:
      random:
        dynamic: {min: 0, max: 0}
        static: {min: 0, max: 0}
        interactive: {min: 0, max: 0}
      characterization:
        modes: {idle: true, linear: true, lateral: true, arc: true, ramps: true, brake: true, angular: true}
        linear_dwell_s: 5.0
        angular_dwell_s: 5.0
        # arc_speed_factors: [0.25, 0.5, 0.75]
        # arc_radius_factors: [1.0, 2.5, 6.0]
        # ramp_horizons_s: [1.0]
    timeout: 600s
