name: fig6_tier1_planner_diversity
description: 'Tier 1: Multi-Planner Benchmark on the Direct 10-Book Retrieval Mission,
  split into 10 chained single-book episodes (a stuck leg fails only its own book).'
references: true
launch:
  sim: gazebo
  headless: true
  env.n: 1
  optim.obstacles: bbox
stages:
- name: stage1_direct_shortest_vector_book_01
  map: library_acoustic_partition
  robot: jackal
  episodes: 1
  timeout: 100.0
  seed: 101
  tm_robots: scenario
  tm_obstacles: scenario
  config:
    scenario:
      file: fig6_retrieval_policy_direct_book_01
