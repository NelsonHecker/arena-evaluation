name: fig6_tier2_policy_synthesis
description: "Tier 2: Macro Routing Policies & Acoustic Spillover Deep-Dive \u2014\
  \ every policy split into 10 chained single-book episodes (a stuck leg fails only\
  \ its own book)."
references: true
