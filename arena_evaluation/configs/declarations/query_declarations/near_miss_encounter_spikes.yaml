name: near_miss_encounter_spikes
title: "Near-Miss Encounter Clearance & Energy Spikes"
description: "Identifies high-risk near-miss encounters where clearance was critical or energy surged dramatically without physical contact"
parameters:
  max_clearance_m:
    type: float
    default: 1.2
    description: "Maximum clearance threshold in meters"
  min_surge_ratio:
    type: float
    default: 1.5
    description: "Minimum energy surge ratio threshold"
sql: |
  SELECT
      d.crowd_condition,
      d.planner,
      e.approach_type,
      COUNT(*) AS near_miss_count,
      AVG(e.min_clearance_m) AS mean_min_clearance_m,
      AVG(e.duration_s) AS mean_duration_s,
      AVG(e.energy_surge_ratio) AS mean_energy_surge_ratio,
      AVG(e.encounter_energy_j) AS mean_encounter_energy_j,
      AVG(e.probst_R_robot) AS mean_probst_R_robot,
      AVG(e.probst_R_actor2) AS mean_probst_R_actor2,
      SUM(CASE WHEN e.had_contact THEN 1 ELSE 0 END) AS contact_count
  FROM fact_encounters e
  JOIN dim_episodes d USING (run_id, episode_id, robot_id)
  WHERE e.min_clearance_m <= :max_clearance_m
    AND e.energy_surge_ratio >= :min_surge_ratio
  GROUP BY d.crowd_condition, d.planner, e.approach_type
  ORDER BY d.crowd_condition, d.planner, e.approach_type
