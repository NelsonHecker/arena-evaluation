  - data_key: "total_time_looked_at_by_pedestrians"
    differentiate: "planner"
    plot_key: "box"
    title: "Total Time Looked at by Peds"
    save_name: "dist_time_looked_at"

episode_plots_for_namespaces:
  desired_results:
    - "GOAL_REACHED"
    - "COLLISION"
    - "TIMEOUT"
  should_add_obstacles: true
  should_add_collisions: true
  title: "All Trajectories"
  save_name: "trajectories_all"

create_best_plots:
  should_add_obstacles: true
  should_add_collisions: false
  title: "Best Trajectories"
  save_name: "trajectories_best"
