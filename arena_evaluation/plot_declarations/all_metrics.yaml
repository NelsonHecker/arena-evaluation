show_plots: false
save_location: "all_metrics_plots"

datasets:
  - "benchmarks/20260608-202954-basic-basic"

results:
  plot: true
  title: "Episode Results"
  save_name: "results"
  differentiate: "planner"

single_episode_line:
  - data_key: "velocity"
    step_size: 1
    differentiate: "planner"
    title: "Velocity over Time (Sample Episode)"
    save_name: "line_velocity"
  - data_key: "acceleration"
    step_size: 1
    differentiate: "planner"
    title: "Acceleration over Time (Sample Episode)"
    save_name: "line_acceleration"
  - data_key: "jerk"
    step_size: 1
    differentiate: "planner"
    title: "Jerk over Time (Sample Episode)"
    save_name: "line_jerk"
  - data_key: "curvature"
    step_size: 1
    differentiate: "planner"
    title: "Curvature over Time (Sample Episode)"
    save_name: "line_curvature"
  - data_key: "roughness"
    step_size: 1
    differentiate: "planner"
    title: "Roughness over Time (Sample Episode)"
    save_name: "line_roughness"

aggregated_distribution:
  - data_key: "velocity"
    differentiate: "planner"
    aggregate: "max"
    plot_key: "box"
    title: "Max Velocity per Episode"
    save_name: "agg_max_velocity"
  - data_key: "acceleration"
    differentiate: "planner"
    aggregate: "max"
    plot_key: "box"
    title: "Max Acceleration per Episode"
    save_name: "agg_max_acceleration"
  - data_key: "jerk"
    differentiate: "planner"
    aggregate: "max"
    plot_key: "box"
    title: "Max Jerk per Episode"
    save_name: "agg_max_jerk"
  - data_key: "curvature"
    differentiate: "planner"
    aggregate: "max"
    plot_key: "box"
    title: "Max Curvature per Episode"
    save_name: "agg_max_curvature"
  - data_key: "roughness"
    differentiate: "planner"
    aggregate: "max"
    plot_key: "box"
    title: "Max Roughness per Episode"
    save_name: "agg_max_roughness"

all_episodes_distribution:
  - data_key: "time_to_goal"
    differentiate: "planner"
    plot_key: "box"
    title: "Time to Goal"
    save_name: "dist_time_to_goal"
  - data_key: "time_diff"
    differentiate: "planner"
    plot_key: "box"
    title: "Time Diff (Legacy)"
    save_name: "dist_time_diff"
  - data_key: "path_length"
    differentiate: "planner"
    plot_key: "box"
    title: "Path Length"
    save_name: "dist_path_length"
  - data_key: "path_efficiency"
    differentiate: "planner"
    plot_key: "box"
    title: "Path Efficiency"
    save_name: "dist_path_efficiency"
  - data_key: "idling_time"
    differentiate: "planner"
    plot_key: "box"
    title: "Idling Time"
    save_name: "dist_idling_time"
  - data_key: "velocity_mean"
    differentiate: "planner"
    plot_key: "box"
    title: "Mean Velocity"
    save_name: "dist_velocity_mean"
  - data_key: "velocity_max"
    differentiate: "planner"
    plot_key: "box"
    title: "Max Velocity"
    save_name: "dist_velocity_max"
  - data_key: "acceleration_mean"
    differentiate: "planner"
    plot_key: "box"
    title: "Mean Acceleration"
    save_name: "dist_acceleration_mean"
  - data_key: "jerk_mean"
    differentiate: "planner"
    plot_key: "box"
    title: "Mean Jerk"
    save_name: "dist_jerk_mean"
  - data_key: "curvature_mean"
    differentiate: "planner"
    plot_key: "box"
    title: "Mean Curvature"
    save_name: "dist_curvature_mean"
  - data_key: "roughness_mean"
    differentiate: "planner"
    plot_key: "box"
    title: "Mean Roughness"
    save_name: "dist_roughness_mean"
  - data_key: "angle_over_length"
    differentiate: "planner"
    plot_key: "box"
    title: "Angle over Length"
    save_name: "dist_angle_over_length"
  - data_key: "collision_amount"
    differentiate: "planner"
    plot_key: "box"
    title: "Collision Amount"
    save_name: "dist_collision_amount"
  - data_key: "total_time_in_personal_space"
    differentiate: "planner"
    plot_key: "box"
    title: "Total Time in Personal Space"
    save_name: "dist_time_in_personal_space"
  - data_key: "avg_velocity_in_personal_space"
    differentiate: "planner"
    plot_key: "box"
