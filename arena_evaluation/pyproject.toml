[project]
name = "arena_evaluation"
version = "1.0.0"
dependencies = [
    "attrs",
    "dtaidistance",
    "jinja2",
    "matplotlib",
    "mcap",
    "mcap-ros2-support",
    "numpy",
    "pillow",
    "plotly",
    "polars",
    "pyarrow",
    "pydantic",
    "pynvml",
    "pyyaml",
    "rich",
    "rosbags>=0.11.3,<0.12",
    "scipy",
    "shapely",
]
dynamic = ["description", "license", "maintainers", "scripts", "entry-points"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
    "network: hits the live upstream host",
]
