name: planner_scorecard_overview
title: "Planner Performance Scorecard Overview"
description: "Overview scorecard across planners, scenarios, and crowd conditions comparing success rates, fault-free success rates, traversal time, and energy consumption"
parameters:
  world:
    type: string
    default: "all"
    description: "Filter by simulation world or 'all'"
  scenario:
    type: string
    default: "all"
    description: "Filter by scenario name or 'all'"
  planner:
    type: string
    default: "all"
    description: "Filter by planner name or 'all'"
sql: |
  SELECT
      world,
      scenario,
      crowd_condition,
      planner,
      dispatcher,
      robot_model,
      episodes_count,
      success_rate,
      success_no_robot_fault_rate,
      mean_time_to_goal_s,
      mean_path_efficiency,
      mean_energy_wh,
      total_encounters,
      total_contacts,
      robot_blame_contacts,
      pedestrian_blame_contacts,
      unavoidable_contacts
  FROM v_planner_scorecard
  WHERE (:world = 'all' OR world = :world)
    AND (:scenario = 'all' OR scenario = :scenario)
    AND (:planner = 'all' OR planner = :planner)
  ORDER BY world, scenario, crowd_condition, planner
