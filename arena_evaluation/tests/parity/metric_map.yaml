# Reviewed correspondence map: legacy combined_metrics column -> star-schema column.
#
# Every entry is one certificate row. A metric key may appear once per star target
# (a single legacy value can feed two fact tables, e.g. path_length feeds both
# fact_episodes and fact_robots).
#
# Fields:
#   metric_key        inventory key; the legacy column of the same name unless
#                     legacy_columns overrides it
#   star_table        one of dim_episodes, fact_episodes, fact_encounters,
#                     fact_contacts, fact_pedestrians, fact_robots
#   star_column       the star column the port writes
#   legacy_columns    the legacy column(s) the star value is derived from
#   legacy_combine    first (default) or sum over legacy_columns
#   legacy_reduction  identity (default) or a list reduction for timeseries columns:
#                     list_mean, list_min, list_max, list_sum, list_len
#   star_reduction    identity (default, one row per key) or mean, min, max, sum,
#                     count for multi-row fact tables
#   note              short human-readable provenance; the scoped producer function
#                     that writes the star value
#
# Only identity-grain targets (one fact row per episode and robot) are claimed for the
# pre-port columns. Windowed social metrics (ENCOUNTER/CONTACT scopes) are now produced per
# window; a window is restricted to its own actor and to the 3 m detection radius (contact:
# [onset - 0.5 s, onset + 0.5 s]), so most legacy episode aggregates do not reduce back to
# the episode value. Three do, verified on parity-g1-window-social: ci_max and
# max_speed_intimate_zone are the episode max of the per-window max (the extreme occurs at
# the closest-approach frame, which always lies inside that actor's encounter window) and
# tti_min is the episode min of the per-window min. Those three are claimed below. The
# remaining reviewed natural reductions are listed for review but deliberately not claimed
# (the certificate would report MISMATCH); their star columns exist and surface as UNMAPPED:
#   sum:  sfm_cumulative_force, esfm_cumulative_force, esfm_ped_cumulative_force,
#         time_in_intimate_zone, time_in_personal_zone, time_in_social_zone,
#         time_in_public_zone, psi_intimate_events, psi_personal_events,
#         psi_social_events, personal_space_intrusion_integral,
#         total_time_looking_at_pedestrians, total_time_looked_at_by_pedestrians,
#         total_time_in_personal_space, hhi_stall_count, hhi_stall_time_s,
#         hhi_stalls_approach, hhi_stalls_hold, hhi_stalls_post, hhi_stalls_rest,
#         hhi_passes_between
#   max:  sfm_peak_force, esfm_peak_force, esfm_ped_peak_force, social_force_max,
#         social_force_ped_max, max_speed_personal_zone, max_speed_social_zone,
#         max_speed_public_zone (a 3 m encounter window never reaches the public zone,
#         so max_speed_public_zone is structurally null there)
#   mean: sfm_mean_force, esfm_mean_force, esfm_ped_mean_force, social_force_mean,
#         social_force_ped_mean, ci_mean, tti_mean, avg_velocity_in_personal_space,
#         movement_towards_peds_ratio, hhi_share_approach, hhi_share_hold,
#         hhi_share_post, hhi_share_rest, hhi_pair_gap_hold
#   min:  hhi_min_pair_clearance
#   no reducible aggregate: hhi_interaction, hhi_hold_onset_s, hhi_release_s,
#         hhi_episode_s (window duration), num_pedestrians (episode peak vs one actor).
# The three contact-scope performance columns ARE claimed below: collision_metrics writes
# the window's own onset count and the parent episode's SPL, and contact intervals are disjoint.
# Verified on parity-g1-window-social (6 episodes): the claimed encounter reductions reproduce
# the legacy value exactly; every unclaimed reduction above is the natural one but differs
# (e.g. sfm_cumulative_force sum by 0.026 N s, num_pedestrians max by 329 pedestrians).
#
# The "ported producers" section below claims the columns added by the port-boundary
# work. fact_episodes and fact_robots carry one row per episode and robot, so their
# values are the calculator output verbatim.
#
# Claim policy: a producer is claimed only where the certificate can compare at least
# --min-nonnull-episodes (3) non-null pairs on the reprocessed benchmark. The published
# columns outside that set stay UNMAPPED until a data-rich benchmark exists:
#   - ne, osr, sdtw, spl_geodesic, ndtw, success_geodesic (vln_metrics) and
#     time_waiting_at_doors_robot have 0-1 non-null comparisons in this run;
#   - ped_round_trips_completed and ped_velocity_delay_ratio are published per
#     pedestrian. Their reviewed per-episode reduction is `mean` for the round trips
#     (the legacy episode value is the pedestrian mean of the same counts) and no
#     reduction reproduces the velocity delay (its per-pedestrian denominator is the
#     pedestrian's own track span, not the episode duration). Both claims are deferred
#     because the certificate joins fact_pedestrians on (run_id, episode_id) while
#     combined_metrics holds one row per robot, so the three non-evaluated robots'
#     status rows read as unexpected legacy nulls.
