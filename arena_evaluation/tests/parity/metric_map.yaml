# Reviewed correspondence map: legacy combined_metrics column -> star-schema column.
#
# Every entry is one certificate row. A metric key may appear once per star target
# (a single legacy value can feed two fact tables, e.g. path_length feeds both
# fact_episodes and fact_robots).
#
# Fields:
#   metric_key        inventory key; the legacy column of the same name unless
#                     legacy_columns overrides it
#   star_table        one of dim_episodes, fact_episodes, fact_encounters,
#                     fact_contacts, fact_pedestrians, fact_robots
#   star_column       the star column the port writes
#   legacy_columns    the legacy column(s) the star value is derived from
#   legacy_combine    first (default) or sum over legacy_columns
#   legacy_reduction  identity (default) or a list reduction for timeseries columns:
#                     list_mean, list_min, list_max, list_sum, list_len
#   star_reduction    identity (default, one row per key) or mean, min, max, sum,
#                     count for multi-row fact tables
#   note              short human-readable provenance; the scoped producer function
#                     that writes the star value
#
# Only identity-grain targets (one fact row per episode and robot) are claimed for the
# pre-port columns. The encounter/contact tables still need a reviewed reduction per
# legacy aggregate: their remaining NO_PRODUCER keys are emitted only at EPISODE scope
# by the calculators (hhi_contact, collision_metrics, gaze_metrics, proxemics,
# proxemics_extended, social_forces), so no per-window value exists to reduce yet.
#
# The "ported producers" section below claims the columns added by the port-boundary
# work. fact_episodes and fact_robots carry one row per episode and robot, so their
# values are the calculator output verbatim. fact_pedestrians is a per-pedestrian
# grain, so its two claims declare a star_reduction:
#   - ped_round_trips_completed: mean over the per-pedestrian rows, because the legacy
#     episode value is the pedestrian mean of the same counts (total / num_agents).
#   - ped_velocity_delay_ratio is published but NOT claimed: the calculator divides
#     each pedestrian's travelled distance by that pedestrian's own track span, while
#     the legacy episode value divides the pedestrian-mean distance by the episode
#     duration, so no per-row reduction reproduces it. It stays UNMAPPED pending a
#     reviewed expected_diff or a port decision.
# The 67 published columns listed below as producers whose columns exist but whose
# mapping is deferred are the keys that are null on both sides in every available run
# (barn, edge-case, mechanism, task-replay, vln and the like); claiming them would add
# gate-failing CERT_NULL_ONLY rows without certifying anything.
version: 1
mappings:
  # --- fact_episodes: written by ScopedEvaluator._episode_fact_row -----------------
  - metric_key: result
    star_table: fact_episodes
    star_column: result
    legacy_columns: [result]
    note: "_episode_fact_row copies the recorded verdict verbatim"
  - metric_key: success
    star_table: fact_episodes
    star_column: success
    legacy_columns: [success]
    note: "_episode_fact_row copies the boolean success flag"
